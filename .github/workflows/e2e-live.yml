name: Live E2E tests

# Runs the CLI against the real Twitch API/CDN (TwitchDownloaderCLI.Tests/LiveTests). Deliberately NOT triggered by pull requests:
# a Twitch outage or a removed clip must never block a PR. A failure here means Twitch changed something (or a test target vanished).
on:
  schedule:
    - cron: '17 6 * * *' # nightly, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-live
  cancel-in-progress: true

jobs:
  live:
    name: live (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: command -v ffmpeg || choco install ffmpeg -y --no-progress

      - name: Run live tests
        shell: bash
        env:
          TD_LIVE_TESTS: '1'
        run: |
          dotnet test --project TwitchDownloaderCLI.Tests \
            --filter-trait "Category=Live" \
            --results-directory "$GITHUB_WORKSPACE/TestResults" \
            --report-junit --report-junit-filename "TwitchDownloaderCLI.Tests.live.junit.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-live-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
