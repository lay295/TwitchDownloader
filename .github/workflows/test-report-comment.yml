name: Test Report Comment

# Runs after "Tests" finishes, in the context of the base repository, so it can comment on PRs from forks.
# It only reads the comment text produced by the test run; it never checks out or executes PR code.
on:
  workflow_run:
    workflows: [ Tests ]
    types: [ completed ]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pr-comment
          path: pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update the sticky comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          pr=$(tr -dc '0-9' < pr-comment/pr-number.txt)
          [ -n "$pr" ] || { echo "No PR number"; exit 0; }
          marker='<!-- twitchdownloader-test-report -->'
          { echo "$marker"; head -c 60000 pr-comment/comment.md; } > body.md
          existing=$(gh api "repos/$REPO/issues/$pr/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$pr/comments" -F body=@body.md > /dev/null
          fi
