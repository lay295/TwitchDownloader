name: Test Report Comment

# PRs from forks only get a read-only token, so tests.yml can't comment on them. This runs after "Tests" finishes, in the
# context of the base repository, and posts the comment text that run produced. It never checks out or executes PR code.
on:
  workflow_run:
    workflows: [ Tests ]
    types: [ completed ]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      # The default branch, not the PR: only trusted scripts run here.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v8
        with:
          name: pr-comment
          path: pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update the sticky comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/post_pr_comment.sh pr-comment
