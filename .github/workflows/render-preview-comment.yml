name: Render Preview Comment

# PRs from forks only get a read-only token, so render-preview.yml can't publish for them. This runs after it finishes, in the
# context of the base repository, and publishes the images that run produced. It never checks out or executes PR code.
on:
  workflow_run:
    workflows: [ Render Preview ]
    types: [ completed ]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      # The default branch, not the PR: only trusted scripts run here.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      # Absent when the triggering run skipped rendering (the PR isn't labelled)
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: render-preview
          path: preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish images and comment
        if: hashFiles('preview/pr-number.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/publish_render_preview.sh preview
