name: Render Preview

# Opt-in visual review: comment "/render-preview" on a PR (owner/members/collaborators only). The sample chats are rendered by the
# base branch and by the PR, and the frames are posted side by side as a PR comment. Comment-triggered workflows always run this
# file from the default branch.
on:
  issue_comment:
    types: [ created ]

permissions:
  contents: read

jobs:
  render:
    if: >-
      github.event.issue.pull_request && startsWith(github.event.comment.body, '/render-preview') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    # Job-level so unrelated PR comments (whose runs skip this job) don't cancel a render in progress
    concurrency:
      group: render-preview-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json number,headRefOid,baseRefOid,baseRefName \
            --jq '"number=\(.number)\nhead_sha=\(.headRefOid)\nbase_sha=\(.baseRefOid)\nbase_ref=\(.baseRefName)"' >> "$GITHUB_OUTPUT"

      # PR code runs in this job, so it gets no write token (and checkout doesn't persist one)
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: head
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: base
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install FFmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)

      - name: Build both CLIs
        run: |
          dotnet build base/TwitchDownloaderCLI -c Release -o cli/base
          dotnet build head/TwitchDownloaderCLI -c Release -o cli/head

      - name: Render and compare
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          python3 head/.github/scripts/render_preview.py --base cli/base/TwitchDownloaderCLI --head cli/head/TwitchDownloaderCLI \
            --fixtures head/TwitchDownloaderCore.Tests/TestData --out preview --base-label "$BASE_REF" --head-label "this PR"
          echo "$PR_NUMBER" > preview/pr-number.txt
          echo "$HEAD_SHA" > preview/head-sha.txt
          sed 's|{BASE_URL}/[^"]*|#|g' preview/comment.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: render-preview
          path: preview

  publish:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The default branch, so only trusted scripts get the write token (the PR's images are validated before hosting)
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v8
        with:
          name: render-preview
          path: preview
      - name: Publish images and comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/publish_render_preview.sh preview
